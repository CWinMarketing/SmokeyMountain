services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-winr}
      POSTGRES_USER: ${POSTGRES_USER:-winr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-winr_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-winr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-winr}:${POSTGRES_PASSWORD:-winr_dev_password}@postgres:5432/${POSTGRES_DB:-winr}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev_cookie_secret_change_me}
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9001}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:8000,http://localhost:9001}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  storefront:
    build: ./storefront
    depends_on:
      - backend
    ports:
      - "8000:8000"
    environment:
      # Server-side (Next.js server components/actions, inside the Docker
      # network): reaches the backend container by its service name.
      MEDUSA_BACKEND_URL: http://backend:9000
      # Client-side (runs in the browser): must be host-reachable, not the
      # internal Docker hostname - the two differ on purpose.
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
    volumes:
      - ./storefront:/app
      - storefront_node_modules:/app/node_modules

volumes:
  pg_data:
  backend_node_modules:
  storefront_node_modules:
